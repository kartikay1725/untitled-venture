version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mvpgenie
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 80
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/mvpgenie
    depends_on:
      - db
    ports:
      - "8000:80"
volumes:
  db_data:

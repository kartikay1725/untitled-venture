name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: mvpgenie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    - name: Lint
      run: |
        flake8 backend
    - name: Test
      run: |
        pytest tests
    - name: Build Docker image
      run: |
        docker build -t mvpgenie-api:latest .
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@v0.1.0
      with:
        image-ref: mvpgenie-api:latest
        format: table

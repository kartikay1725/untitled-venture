apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvpgenie-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mvpgenie-api
  template:
    metadata:
      labels:
        app: mvpgenie-api
    spec:
      containers:
      - name: api
        image: <registry>/mvpgenie-api:latest
        ports:
        - containerPort: 80
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mvpgenie-secrets
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mvpgenie-secrets
              key: SECRET_KEY
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
